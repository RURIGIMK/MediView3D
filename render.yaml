services:
  - type: web
    name: mediview3d-web
    runtime: static
    branch: kyle-3d-skeleton-render
    buildCommand: mkdir -p web/assets/anatomy && cp assets/anatomy/skeleton_scan.glb assets/anatomy/mediview_anatomy.obj assets/anatomy/mediview_anatomy.mtl web/assets/anatomy/
    staticPublishPath: ./web
    headers:
      - path: /assets/anatomy/*
        name: Cache-Control
        value: public, max-age=86400
